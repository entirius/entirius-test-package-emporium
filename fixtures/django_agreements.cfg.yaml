    info_clause: "TEST — Information clause (art. 14 GDPR) placeholder for legitimate interest, EN. Your address {recipient_email} was obtained from a public source."
    optout_clause: "TEST — Opt-out clause placeholder for legitimate interest, EN. Object to processing of {recipient_email} at any time by replying STOP."
    retention_clause: "TEST — Retention clause placeholder for legitimate interest, EN. We keep your data for at most 12 months or until you object."
