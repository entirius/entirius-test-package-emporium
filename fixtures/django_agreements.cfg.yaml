- model: django_agreements.consentrecord
  pk: 152
  fields:
    email: "erase@example-gdpr.test"
    agreement_version: 3
    granted: true
    source: import
    ip_address: "192.0.2.152"
    user_agent: "Mozilla/5.0 (L-17 fixture)"
    channel_idx: default-europe
    created_at: "2026-01-02T00:00:00Z"

