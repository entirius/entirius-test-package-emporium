# entirius-test-package: COMPREHENSIVE Discount Rules Test Data
#
# This fixture file contains COMPLETE test coverage for ALL Volkanos discount features:
# - All 12 modifier types
# - DiscountModeOfAction (product filtering for discounts/gratis)
# - ThresholdProductFilter (threshold calculation filtering)
# - Multi-currency support
# - Complex filter combinations
#
# Total: 30+ discount rules with full configuration
#
# Import: loaddata --format=yaml django_checkout.discounts.comprehensive.yaml
#
# PKs start at 100 to avoid collisions. Assumes:
# - Channel pk=2 (default-europe)
# - Currency pk=1 (PLN), pk=2 (USD), pk=3 (EUR)
# - Category pks will be referenced by idx (e.g., 'sofas', 'chairs')
# - Product pks will be referenced by SKU (e.g., 'ENT-S001')

