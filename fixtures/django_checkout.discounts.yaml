# entirius-test-package: Test Discount Rules
#
# 10 comprehensive test discount rules covering all major modifier types,
# targets, and features (combinable, auto-apply, gratis, progressive, etc.)
#
# Import: loaddata --format=yaml django_checkout.discounts.yaml
#
# Note: PK values start at 100 to avoid collisions with manual testing.
# Channel pk=2 = default-europe, Currency pk=3 = EUR

# ─────────────────────────────────────────────────────────────────────────
# Discount Rule Codes
# ─────────────────────────────────────────────────────────────────────────

- model: django_checkout.discountrulecode
  pk: 100
  fields:
    name: TEST_PERCENT_10
    free_shipping: false
    min_order_amount: '0.00'
    free_order: false
    is_omnibus: false
    target: all
    modifier: percent_discount
    extra_value: 10
    extension: {}
    priority: 10
    combine_with_other_rules: false
    automatic_applications: false
    is_active: true
    show_when_invalid: true
    channels:
    - 2
    free_shipping_methods: []
    currencies:
    - 3

