# --- Page 8: Blog — Sustainable Shopping (blog-post, no authors — backwards compat test) ---
- model: django_contentdb.content
  pk: 15
  fields:
    uid: c0000001-000f-4000-8000-00000000000f
    content:
      document_configs: {}
      tiles:
        bb000801-0001-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>The Green Economy Shift</h2>
            <p>Consumers are voting with their wallets. <strong>73% of global consumers</strong> are willing to change their consumption habits to reduce environmental impact. For e-commerce businesses, this means the era of "greenwashing" is over — customers expect <em>real action</em>, not just marketing claims.</p>
            <p>The shift is not just ethical — it is also economic. Studies show that eco-conscious brands enjoy higher customer loyalty, premium pricing power, and positive media coverage. Building sustainability into your supply chain is no longer a nice-to-have; it is a competitive advantage.</p>
            <ul>
            <li><strong>Sustainable Packaging:</strong> Biodegradable mailers, recycled cardboard, and plastic-free inserts reduce waste and shipping weight</li>
            <li><strong>Carbon-Neutral Shipping:</strong> Offset programs or partnerships with green logistics providers appeal to environmentally aware customers</li>
            <li><strong>Circular Economy:</strong> Offer take-back programs, repair services, or resale platforms to extend product lifecycles</li>
            <li><strong>Transparent Supply Chains:</strong> Document sourcing, manufacturing practices, and ethical labour standards</li>
            </ul>
        bb000801-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Practical Steps for Your Store</h2>
            <ol>
            <li><strong>Audit your supply chain</strong> — identify the highest-impact areas (packaging, shipping, production)</li>
            <li><strong>Switch to eco-friendly packaging</strong> — work with suppliers offering compostable or recyclable alternatives</li>
            <li><strong>Partner with green logistics</strong> — choose carriers that offer carbon offset or zero-emission delivery options</li>
            <li><strong>Highlight sustainability in product pages</strong> — use badges, certifications, and transparent sourcing information</li>
            <li><strong>Communicate your progress</strong> — publish annual sustainability reports and celebrate milestones with customers</li>
            </ol>
            <blockquote>The most successful sustainable brands do not just talk about impact — they measure it, report it, and continuously improve. Trust is built through transparency, not promises.</blockquote>
      sections:
        aa000801-0000-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa000801-0001-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
      tiles_order:
        aa000801-0000-4000-8000-000000000001:
          - bb000801-0001-4000-8000-000000000001
        aa000801-0001-4000-8000-000000000001:
          - bb000801-0002-4000-8000-000000000001
      sections_order:
        - aa000801-0000-4000-8000-000000000001
        - aa000801-0001-4000-8000-000000000001
