# --- Page 4: Blog — Welcome to Entirius (blog-post) ---
# Rich-text showcase: h2, h3, bold, italic, underline, ul, ol, blockquote, links
- model: django_contentdb.content
  pk: 7
  fields:
    uid: c0000001-0007-4000-8000-000000000007
    content:
      document_configs: {}
      tiles:
        bb000401-0001-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Why We Built Entirius</h2>
            <p>After years of working with legacy e-commerce platforms, we knew there had to be a <strong>better way</strong>. Monolithic systems are hard to maintain, slow to evolve, and force businesses into rigid workflows. We wanted something <em>modular</em>, something that lets you install only what you need.</p>
            <blockquote>We are not trying to monetize the platform itself. We have our own stores running on it. We make money selling socks — and other things.</blockquote>
            <h3>Core Principles</h3>
            <ul>
            <li><strong>Modularity:</strong> Each module is an independent Django package with its own models, schemas, services, and API. Install <u>django-pim</u> without knowing <u>django-checkout</u> exists.</li>
            <li><strong>API-first:</strong> Every feature exposes a clean REST API. The CMS and Storefront are decoupled frontends — swap them, extend them, or build your own.</li>
            <li><strong>No vendor lock-in:</strong> Open standards, Pydantic schemas, OpenAPI specs. Your data is yours.</li>
            </ul>
            <h2>What Makes the Architecture Different</h2>
            <p>Entirius is a <strong>modular monolith</strong> — not microservices (we do not hate ourselves), not a big ball of mud (we have been there). Here is how a typical request flows:</p>
            <ol>
            <li><strong>Storefront</strong> sends a request to the Matrix API</li>
            <li><strong>Matrix</strong> aggregates data from PIM and regional modules</li>
            <li><strong>Response</strong> is assembled server-side and returned as a single payload</li>
            <li><strong>Storefront</strong> renders the page with SSR — crawlers see real content</li>
            </ol>
            <p>This approach gives us the <em>deployment simplicity</em> of a monolith with the <em>organisational clarity</em> of microservices. Read more in our <a href="/about">architecture overview</a>.</p>
        bb000401-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Getting Involved</h2>
            <p>Whether you are evaluating Entirius for your next project or just curious about the tech stack, here are some ways to get started:</p>
            <ul>
            <li>Browse the <a href="/blog/getting-started">Getting Started guide</a> for a step-by-step walkthrough</li>
            <li>Check the <strong>API documentation</strong> — auto-generated from Pydantic schemas via drf-spectacular</li>
            <li>Read about our <a href="/blog/ai-in-e-commerce">AI integrations</a> and where we are headed</li>
            </ul>
            <blockquote>Yes, we let robots write our code. No, we are not sorry.</blockquote>
      sections:
        aa000401-0000-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa000401-0001-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
      tiles_order:
        aa000401-0000-4000-8000-000000000001:
          - bb000401-0001-4000-8000-000000000001
        aa000401-0001-4000-8000-000000000001:
          - bb000401-0002-4000-8000-000000000001
      sections_order:
        - aa000401-0000-4000-8000-000000000001
        - aa000401-0001-4000-8000-000000000001
    extension:
      title: "Welcome to Entirius"
      description: "<p>An introduction to the Entirius e-commerce platform.</p>"
      author: "Anna Kowalska"
      custom_buttons:
        - label: "Read more"
          url: "/blog/welcome-to-entirius"
          type: "internal"
