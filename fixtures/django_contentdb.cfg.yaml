# --- Page 5: Blog — Getting Started (blog-post) ---
# Step-by-step guide: numbered lists, blockquotes as tips, multiple sections, image section
- model: django_contentdb.content
  pk: 9
  fields:
    uid: c0000001-0009-4000-8000-000000000009
    content:
      document_configs: {}
      tiles:
        bb000501-0001-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Prerequisites</h2>
            <p>Before you begin, make sure you have the following installed on your machine:</p>
            <ul>
            <li><strong>Docker</strong> and <strong>Docker Compose</strong> — the entire stack runs in containers</li>
            <li><strong>Git</strong> with SSH key configured for repository access</li>
            <li><strong>Node.js 18+</strong> — for running the CMS and Storefront frontends locally</li>
            <li><strong>Python 3.11+</strong> with <strong>UV</strong> package manager (replaces pip)</li>
            </ul>
            <blockquote>Tip: On macOS, install Docker Desktop. On Linux, use Docker Engine with the compose plugin. Avoid Snap packages — they cause permission issues with volume mounts.</blockquote>
        bb000501-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Step-by-Step Setup</h2>
            <ol>
            <li><strong>Clone the Docker repo</strong> — this is your orchestration layer. All source repos will be cloned into the <em>repos/</em> subdirectory.</li>
            <li><strong>Copy the environment file</strong> — <code>cp .env.example .env</code> and fill in your credentials and channel config.</li>
            <li><strong>Build the backend image</strong> — run <code>make build</code>. This installs the platform packages. Takes 3-5 minutes on first run.</li>
            <li><strong>Start infrastructure</strong> — <code>make dev</code> brings up PostgreSQL, Redis, RabbitMQ, and the backend with live-mounted source code.</li>
            <li><strong>Seed the database</strong> — <code>make seed</code> loads fixture data, creates test users, and imports the product catalogue.</li>
            <li><strong>Start the frontends</strong> — <code>npm run dev</code> in both <em>storefront-blueprint</em> and <em>cms-blueprint</em> directories.</li>
            </ol>
            <h3>Verifying the Setup</h3>
            <p>After completing the steps above, you should be able to access:</p>
            <ul>
            <li>Backend API: <strong>localhost:8000/api/docs/</strong> — Swagger UI with all v2 endpoints</li>
            <li>CMS: <strong>localhost:8080</strong> — log in with the superuser credentials from <code>make seed</code></li>
            <li>Storefront: <strong>localhost:3000</strong> — the customer-facing store with SSR</li>
            </ul>
            <blockquote>If the storefront shows an error page, check that the DEFAULT_CHANEL environment variable matches a channel in your PIM. This is the most common setup issue.</blockquote>
        bb000501-0003-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Common Issues</h2>
            <h3>Build fails with SSH error</h3>
            <p>Make sure your SSH agent is running and has your deploy key loaded. Docker BuildKit needs <code>--ssh default</code> to forward your SSH credentials into the build context.</p>
            <h3>Database connection refused</h3>
            <p>The PostgreSQL container may still be starting. Run <code>docker compose ps</code> to check health status. The <em>db</em> service should show <strong>(healthy)</strong> before the backend can connect.</p>
            <h3>Modules not reflecting local changes</h3>
            <p>If you edited a Django module but the change is not visible, make sure you are running <code>make dev</code> (not <code>make up</code>). The <em>dev</em> compose file mounts local repos into the container. Without it, you are running code baked into the image at build time.</p>
      sections:
        aa000501-0000-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa000501-0001-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa000501-0002-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
