- model: django_contentdb.content
  pk: 26
  fields:
    uid: c0000026-0001-4000-8000-000000000001
    content:
      document_configs: {}
      tiles:
        bb001201-0001-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>The Trust Equation</h2>
            <p>In the physical world, a handshake and face-to-face conversation build trust. Online, you have no such luxury. Every interaction must <strong>communicate safety, competence, and authenticity</strong>.</p>
            <p>Customers want to know that:</p>
            <ul>
            <li><strong>SSL certificates</strong> and encrypted checkout protect their payment information</li>
            <li><strong>Clear return policies</strong> mean they can buy without fear of losing money</li>
            <li><strong>Real customer reviews</strong> (not fake testimonials) prove you deliver on promises</li>
            <li><strong>Transparent pricing</strong> means no hidden fees at checkout</li>
            </ul>
        bb001201-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Building Trust at Every Touchpoint</h2>
            <h3>Before Purchase</h3>
            <ul>
            <li>Display security badges prominently on every page</li>
            <li>Show real customer photos and reviews (not stock images)</li>
            <li>Make shipping costs and timelines visible before checkout</li>
            </ul>
            <h3>During Checkout</h3>
            <ul>
            <li>Use recognisable payment providers (Stripe, PayPal, Apple Pay)</li>
            <li>Show the SSL lock icon and "secure" label</li>
            <li>Offer guest checkout — forcing account creation frustrates customers</li>
            </ul>
            <h3>After Purchase</h3>
            <ul>
            <li>Send order confirmation and tracking immediately</li>
            <li>Make returns hassle-free — clear instructions, prepaid labels if possible</li>
            <li>Respond to support emails within 24 hours</li>
            </ul>
        bb001201-0003-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Measuring Trust</h2>
            <blockquote>Trust is built slowly and destroyed quickly. Invest in systems that protect customer data and handle complaints promptly.</blockquote>
            <p>How do you measure something intangible like trust? These metrics correlate strongly with customer trust:</p>
            <ol>
            <li><strong>Customer reviews and ratings</strong> — average rating, number of reviews, response rate to negative feedback</li>
            <li><strong>Return/refund rate</strong> — high returns suggest either product mismatches or trust issues in the product description</li>
            <li><strong>Support ticket resolution time</strong> — fast responses signal you care; slow responses erode trust</li>
            <li><strong>Repeat purchase rate</strong> — customers who trust you come back</li>
            </ol>
      sections:
        aa001201-0000-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa001201-0001-4000-8000-000000000001:
