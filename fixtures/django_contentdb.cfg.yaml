# =========================================================================
# Blog Post 5: E-Commerce Analytics for Growth (Technology)
# Content pk=24 (draft), pk=25 (published)
# Draft pk=13, Published pk=12, Route pk=11
# =========================================================================

- model: django_contentdb.content
  pk: 24
  fields:
    uid: c0000024-0001-4000-8000-000000000001
    content:
      document_configs: {}
      tiles:
        bb001101-0001-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Metrics That Matter</h2>
            <p>Not all analytics are created equal. Vanity metrics like page views and session duration tell you <em>what happened</em>, but not <em>why it matters</em>. The metrics that drive business decisions are the ones tied directly to revenue and customer behaviour.</p>
            <p>Here are the <strong>key performance indicators</strong> every e-commerce business should track:</p>
            <table>
            <tr><th>Metric</th><th>What It Tells You</th><th>Target Range</th></tr>
            <tr><td>Conversion Rate</td><td>% of visitors who purchase</td><td>1-5%</td></tr>
            <tr><td>Average Order Value</td><td>Mean revenue per transaction</td><td>Industry-dependent</td></tr>
            <tr><td>Customer Lifetime Value</td><td>Total revenue per customer</td><td>10-50x AOV</td></tr>
            <tr><td>Cart Abandonment Rate</td><td>% of carts not completed</td><td>&lt;70%</td></tr>
            </table>
        bb001101-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>From Data to Decisions</h2>
            <p>Collecting data is easy. Acting on it is the challenge. Here is a four-step workflow to turn analytics into action:</p>
            <ol>
            <li><strong>Track at the right level</strong> — instrument your storefront to capture user events (add to cart, purchase, returns, support tickets)</li>
            <li><strong>Segment your audience</strong> — break down metrics by device, geography, customer cohort, product category to identify patterns</li>
            <li><strong>Set benchmarks</strong> — establish baseline metrics and set quarterly improvement targets (e.g., reduce cart abandonment by 5%)</li>
            <li><strong>Test and iterate</strong> — run A/B tests on checkout flow, product layout, and messaging to validate improvements before full rollout</li>
            </ol>
            <blockquote>The most successful e-commerce businesses do not have better instincts — they have better data. They measure, they test, they learn.</blockquote>
      sections:
        aa001101-0000-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
        aa001101-0001-4000-8000-000000000001:
          core_type: section-text
          variant: 3
          dye: 3
          width: content_width
      tiles_order:
        aa001101-0000-4000-8000-000000000001:
          - bb001101-0001-4000-8000-000000000001
        aa001101-0001-4000-8000-000000000001:
          - bb001101-0002-4000-8000-000000000001
      sections_order:
        - aa001101-0000-4000-8000-000000000001
        - aa001101-0001-4000-8000-000000000001
    extension:
      title: "E-Commerce Analytics for Growth"
      description: "<p>Which metrics matter most and how to turn analytics into revenue.</p>"
      author: "Maria Wisniewska"
      custom_buttons:
        - label: "Read more"
          url: "/blog/ecommerce-analytics-for-growth"
          type: "internal"
      images_set:
        desktop:
          set:
            - source: "https://picsum.photos/seed/blog-analytics/800/600"
              height: 600
        mobile:
          set:
            - source: "https://picsum.photos/seed/blog-analytics-m/400/300"
              height: 300
    meta:
      title: "E-Commerce Analytics for Growth"
      description: "Data-driven strategies for growing your online store"
      og_title: "E-Commerce Analytics for Growth"
      og_description: "Turn raw analytics into actionable insights"
    created_at: 2025-02-05 10:00:00+00:00
    updated_at: 2025-02-05 10:00:00+00:00
    category: 3

