            </ul>
            <h2>What Makes the Architecture Different</h2>
            <p>Entirius is a <strong>modular monolith</strong> — not microservices (we do not hate ourselves), not a big ball of mud (we have been there). Here is how a typical request flows:</p>
            <ol>
            <li><strong>Storefront</strong> sends a request to the Matrix API</li>
            <li><strong>Matrix</strong> aggregates data from PIM and regional modules</li>
            <li><strong>Response</strong> is assembled server-side and returned as a single payload</li>
            <li><strong>Storefront</strong> renders the page with SSR — crawlers see real content</li>
            </ol>
            <p>This approach gives us the <em>deployment simplicity</em> of a monolith with the <em>organisational clarity</em> of microservices. Read more in our <a href="/about">architecture overview</a>.</p>
        bb000401-0002-4000-8000-000000000001:
          core_type: tile-txt-btn
          description: >-
            <h2>Getting Involved</h2>
            <p>Whether you are evaluating Entirius for your next project or just curious about the tech stack, here are some ways to get started:</p>
            <ul>
            <li>Browse the <a href="/blog/getting-started">Getting Started guide</a> for a step-by-step walkthrough</li>
            <li>Check the <strong>API documentation</strong> — auto-generated from Pydantic schemas via drf-spectacular</li>
            <li>Read about our <a href="/blog/ai-in-e-commerce">AI integrations</a> and where we are headed</li>
            </ul>
            <blockquote>Yes, we let robots write our code. No, we are not sorry.</blockquote>
      sections:
