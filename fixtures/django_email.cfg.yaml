# Email templates — AccountsNewAccount
# pk=1: null values (used by BDD test "Retrieve template with null values")
- model: django_email.accountsnewaccount
  pk: 1
  fields:
    channel: 1
    language: 2
    subject: null
    welcome: null
    announce: null
    confirm_button: null
    thank_you: null
    help: null

# pk=2: Polish lang config (used by BDD PATCH + retrieve tests)
- model: django_email.accountsnewaccount
  pk: 2
