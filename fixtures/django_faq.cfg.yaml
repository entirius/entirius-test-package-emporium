    modified_at: "2025-01-01T00:00:00Z"

# FaqItem 3: shipping group
- model: django_faq.faqitem
  pk: 3
  fields:
    group: 1
    url_key: how-to-return-an-item
    question: "How do I return an item?"
    answer: "<p>You can return items within 30 days of delivery. Contact support to initiate a return.</p>"
    short_answer: "Return within 30 days via support"
    position: 2
    position_in_group: 2
    is_active: true
