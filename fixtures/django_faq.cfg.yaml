# FaqItem 1: shipping group
- model: django_faq.faqitem
  pk: 1
  fields:
    group: 1
    url_key: how-long-does-shipping-take
    question: "How long does shipping take?"
    answer: "<p>Standard shipping takes 3-5 business days. Express shipping takes 1-2 business days.</p>"
    short_answer: "3-5 business days (standard), 1-2 days (express)"
    position: 0
    position_in_group: 0
    is_active: true
    created_at: "2025-01-01T00:00:00Z"
    modified_at: "2025-01-01T00:00:00Z"

# FaqItem 2: shipping group
- model: django_faq.faqitem
  pk: 2
  fields:
    group: 1
    url_key: how-to-track-my-order
    question: "How can I track my order?"
    answer: "<p>You will receive a tracking link via email once your order has been shipped.</p>"
    short_answer: "Check the tracking link in your email"
    position: 1
