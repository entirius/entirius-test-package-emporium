# =========================================================================
# django_leads seed — channel default-europe with its pipeline, 6 companies and 10 contacts.
# Pk ranges of the leads-platform modules (cross-fixture references stay stable):
#   communicator 1–99, leads 100–199, notifications 200–299, siteintel 300–399.
# example-shop-1.test stays free for the plan 12 funnel import; example-shop-4.test holds 3 contacts
# (plans 10–12); blocked@example-shop-9.test matches the communicator suppression (plan 05).
# loaddata bypasses save(): languages are listed explicitly (pl=1, en=2) and nothing emits stage_entered.
# =========================================================================

- model: django_leads.channel
  pk: 100
  fields:
    idx: default-europe
    name: Default Europe
    default_language: 1
    languages: [1, 2]
    retention_days: null
    created_at: "2025-01-01T00:00:00Z"
    modified_at: "2025-01-01T00:00:00Z"


