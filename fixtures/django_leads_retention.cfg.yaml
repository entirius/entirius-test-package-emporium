# =========================================================================
# django_leads retention + GDPR seed (plan 11) — channel default-europe (pk 100), leads pk range 100–199.
# Loaded right after django_leads.cfg.yaml (stages: contacted = 102, won = 105).
#
# L-16: example-stale.test (company 150) sits in `contacted`, idle since 2025-01-01 (> 180 days before any
#   run) — its contact stale@example-stale.test (contact 150) is anonymised by `test/anonymise-now/`.
#   example-stale-won.test (company 151) is as old but `won` — its contact (151) must survive.
# L-17: example-gdpr.test (company 152, `last_activity_at` null, so retention never picks it) — contact
#   erase@example-gdpr.test (152) is exported and erased; a dedicated company keeps plan 10's example-shop-4
#   contacts intact (this feature sorts before leads_pipeline.feature).
# Cross-references: django_communicator.cfg.yaml threads 10 (subject_ref leads.Company:150) and
#   11 (leads.Company:152) with one sent message each (10, 11). Keep these pks stable.
# =========================================================================

- model: django_leads.company
  pk: 150
  fields:
    channel: 100
    name: Example Stale
    domain: example-stale.test
    website: https://www.example-stale.test/
    company_type: RETAILER
    industry: garden
    description: ""
    platform: ""
    hooks: []
    stage: 102
    stage_entered_at: "2025-01-01T00:00:00Z"
    source: csv
    external_ref: ""
    do_not_contact: false
    customer_uid: null
    rotation_count: 0
    last_activity_at: "2025-01-01T00:00:00Z"
    created_at: "2025-01-01T00:00:00Z"
    modified_at: "2025-01-01T00:00:00Z"

