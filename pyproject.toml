[project]
name = "entirius-test-package-emporium"
version = "1.0.0"
description = "BDD test suite and demo data package (Emporium) for the Entirius/Volkanos platform"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "behave>=1.2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]
e2e = ["pytest>=8", "pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/entirius/entirius-test-package-emporium"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entirius_tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]
ignore = ["E501"]

# Legacy migrated 1:1 - per-file ignores mirror the inherited code shape, tighten on refactor.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"features/**" = ["S101"]
"e2e/**" = ["S101"]
"features/environment.py" = ["S112"]
"features/steps/pim_advanced_steps.py" = ["B904"]
"features/steps/matrix_steps.py" = ["B904"]
"features/steps/discount_steps.py" = ["B011"]
"features/steps/contentdb_steps.py" = ["B007"]
"src/entirius_tests/assertions.py" = ["S101"]
"scripts/*.py" = ["E402"]
"devtools/**" = ["S608", "S324", "B023", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["entirius_tests"]

[tool.ruff.format]
quote-style = "double"

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "e2e"]
